[workspace]
members = [
    "crates/crab-core",
    "crates/crab-query",
    "crates/crab-driver",
    "crates/crab-orm",
    "examples/sqlite-todo",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
crab-core = { path = "crates/crab-core" }
crab-query = { path = "crates/crab-query" }
crab-driver = { path = "crates/crab-driver" }
crab-orm = { path = "crates/crab-orm" }
sea-query = { version = "1.0.2", default-features = false, features = ["backend-sqlite"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
